<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gesportium - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Montserrat:wght@700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#353534",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-secondary-container": "#b7b5b4",
                        "on-surface": "#e5e2e1",
                        "on-tertiary-fixed": "#1b1c1c",
                        "surface-container-low": "#1c1b1b",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary-fixed": "#e4e2e1",
                        "inverse-primary": "#506600",
                        "surface-container-lowest": "#0e0e0e",
                        "on-background": "#e5e2e1",
                        "tertiary": "#ffffff",
                        "on-primary-container": "#556d00",
                        "primary-fixed": "#c3f400",
                        "secondary": "#c8c6c5",
                        "on-tertiary-container": "#656464",
                        "tertiary-fixed-dim": "#c8c6c6",
                        "on-secondary": "#313030",
                        "primary": "#ffffff",
                        "on-tertiary": "#303030",
                        "on-error-container": "#ffdad6",
                        "background": "#131313",
                        "on-surface-variant": "#c4c9ac",
                        "surface-tint": "#abd600",
                        "inverse-on-surface": "#313030",
                        "on-secondary-fixed": "#1c1b1b",
                        "primary-container": "#c3f400",
                        "on-primary-fixed-variant": "#3c4d00",
                        "surface-container": "#201f1f",
                        "secondary-container": "#474746",
                        "outline-variant": "#444933",
                        "secondary-fixed": "#e5e2e1",
                        "surface-container-high": "#2a2a2a",
                        "primary-fixed-dim": "#abd600",
                        "inverse-surface": "#e5e2e1",
                        "tertiary-container": "#e4e2e1",
                        "on-secondary-fixed-variant": "#474746",
                        "outline": "#8e9379",
                        "surface": "#131313",
                        "surface-dim": "#131313",
                        "on-primary": "#283500",
                        "surface-container-highest": "#353534",
                        "on-error": "#690005",
                        "on-primary-fixed": "#161e00",
                        "error-container": "#93000a",
                        "surface-bright": "#3a3939",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "unit": "4px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Montserrat"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Montserrat"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Montserrat"],
                        "display-lg": ["Montserrat"],
                        "body-md": ["Inter"],
                        "label-bold": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "900" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "900" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .glass-card {
            background: rgba(45, 45, 45, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        .skewed-bg {
            transform: skewY(-2deg);
            transform-origin: top left;
        }
        .input-energetic:focus {
            border-bottom-color: theme('colors.primary-fixed');
            box-shadow: 0 1px 0 0 theme('colors.primary-fixed');
        }
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(195, 244, 0, 0.3);
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-body-md overflow-x-hidden relative">
<!-- Decorative Background Elements -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-0 left-0 w-full h-1/2 bg-surface-container-lowest skewed-bg -mt-10"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-primary-fixed/5 rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-margin-mobile md:px-0 z-10 relative">
<!-- Brand Header -->
<div class="text-center mb-10">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg italic uppercase tracking-tighter text-primary-fixed mb-2">Gesportium</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Alto rendimiento, unificado.</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl p-gutter w-full transition-all duration-300">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="sr-only" for="email">Correo electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 bg-[#1A1A1A] border-0 border-b-2 border-surface-variant text-on-surface focus:ring-0 input-energetic transition-colors py-3" id="email" name="email" placeholder="Correo electrónico" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="sr-only" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 bg-[#1A1A1A] border-0 border-b-2 border-surface-variant text-on-surface focus:ring-0 input-energetic transition-colors py-3" id="password" name="password" placeholder="Contraseña" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-on-surface-variant hover:text-primary-fixed transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</div>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex items-center justify-end">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary-fixed transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-DEFAULT text-on-primary-fixed bg-primary-fixed font-headline-lg text-headline-lg-mobile md:text-headline-md uppercase tracking-wider btn-glow transition-all duration-200" type="submit">
                        Entrar
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/10"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm">O continuar con</span>
</div>
</div>
<!-- Social Login Options -->
<div class="grid grid-cols-2 gap-4">
<button class="flex justify-center items-center py-2 px-4 border border-white/10 rounded-DEFAULT bg-[#1A1A1A] hover:bg-surface-variant transition-colors text-on-surface" type="button">
<span class="material-symbols-outlined mr-2">account_circle</span>
<span class="font-label-bold text-label-bold">Google</span>
</button>
<button class="flex justify-center items-center py-2 px-4 border border-white/10 rounded-DEFAULT bg-[#1A1A1A] hover:bg-surface-variant transition-colors text-on-surface" type="button">
<span class="material-symbols-outlined mr-2">file_download</span>
<span class="font-label-bold text-label-bold">Apple</span>
</button>
</div>
</div>
<!-- Create Account Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                ¿No tienes una cuenta? 
                <a class="font-label-bold text-label-bold text-primary-fixed hover:text-white transition-colors uppercase ml-1 border-b border-transparent hover:border-white" href="#">Crear cuenta</a>
</p>
</div>
</main>
</body></html>
