name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gesportium
          POSTGRES_PASSWORD: gesportium
          POSTGRES_DB: gesportium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gesportium"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://gesportium:gesportium@localhost:5432/gesportium
      JWT_SECRET_KEY: ci-test-secret
      TOTEM_API_KEY: ci-test-totem-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
